services:
  mysql:
    image: mysql:8.0
    container_name: flowstate-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    env_file:
      - ./mysql.env
    command:
      - --default-authentication-plugin=mysql_native_password
      - --mysqlx=0
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_prod_data:
