map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

limit_req_zone $binary_remote_addr zone=flowstate_register:10m rate=5r/m;

server {
  listen 80;
  listen [::]:80;
  server_name flo-state.in www.flo-state.in;

  return 301 https://flo-state.in$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.flo-state.in;

  ssl_certificate /etc/letsencrypt/live/flo-state.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/flo-state.in/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://flo-state.in$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name flo-state.in;

  ssl_certificate /etc/letsencrypt/live/flo-state.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/flo-state.in/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 25m;
  error_page 503 = /__flowstate_maintenance__;

  set $flowstate_maintenance off;
  if (-f /etc/nginx/flowstate-maintenance-on) {
    set $flowstate_maintenance on;
  }

  location = /__flowstate_maintenance__ {
    internal;
    alias /var/www/flowstate-maintenance/maintenance.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "15" always;
  }

  location /socket.io/ {
    if ($flowstate_maintenance = on) {
      return 503;
    }

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location = /api/auth/register {
    if ($flowstate_maintenance = on) {
      return 503;
    }

    limit_req zone=flowstate_register burst=3 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location / {
    if ($flowstate_maintenance = on) {
      return 503;
    }

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}
